<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KPT Tolverdeling</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="authShell" class="auth-shell" hidden>
    <section class="auth-card">
      <img src="https://kuijperstransport.nl/Images/Logo.png" alt="Kuijpers Transport" />
      <h1 id="authTitle">Inloggen</h1>
      <p id="authText">Log in om de tolverdeling te gebruiken.</p>
      <form id="authForm">
        <label>
          Gebruikersnaam
          <input id="authUsername" type="text" autocomplete="username" required />
        </label>
        <label>
          Wachtwoord
          <input id="authPassword" type="password" autocomplete="current-password" minlength="4" required />
        </label>
        <button id="authSubmit" class="button button-primary" type="submit">Inloggen</button>
      </form>
      <div id="authError" class="message error" hidden></div>
    </section>
  </main>

  <div id="appShell" hidden>
    <header class="header">
      <div class="header-inner">
        <img src="https://kuijperstransport.nl/Images/Logo.png" alt="Kuijpers Transport" />
        <div class="header-actions">
          <span id="currentUser"></span>
          <button id="usersButton" class="header-button" type="button" hidden>Gebruikers</button>
          <button id="logoutButton" class="header-button" type="button">Uitloggen</button>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="upload-section">
        <div class="upload-grid">
          <div id="planningDropZone" class="upload-box">
            <h2>1. Rittenboek</h2>
            <p>Meerdere weekbestanden tegelijk, bijvoorbeeld Week 38 t/m 42.</p>
            <label class="button button-primary">
              Kiezen
              <input id="planningInput" type="file" accept=".xls,.xlsx" multiple hidden />
            </label>
          </div>

          <div id="reportDropZone" class="upload-box">
            <h2>2. Tolrapporten</h2>
            <p>Meerdere CSV’s tegelijk, of één groot Telepass-bestand.</p>
            <label class="button">
              Kiezen
              <input id="reportInput" type="file" accept=".csv,.xls,.xlsx" multiple hidden />
            </label>
          </div>
        </div>

        <div id="uploadStatus" class="message" hidden></div>

        <div id="sourceStatus" class="source-status" hidden>
          <div>
            <strong id="planningFiles">Nog geen rittenboek</strong>
            <span id="reportName">Geen tolrapporten</span>
          </div>
          <button id="clearSessionBtn" class="text-button" type="button">Wissen</button>
        </div>
      </section>

      <section id="resultsSection" class="results" hidden>
        <div class="results-head">
          <h2>Klanten</h2>
          <label>
            Week
            <select id="weekSelect"></select>
          </label>
        </div>

        <div class="toolbar">
          <button id="zipInvoiceBtn" class="button button-primary" type="button">Alle PDF’s</button>
          <input id="searchInput" type="search" placeholder="Zoek klant…" />
        </div>

        <div id="summary" class="summary"></div>
        <div id="weekCheck" class="week-check" hidden></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Klant</th>
                <th>Landen</th>
                <th class="number">Tol</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="companyRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="userModal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="usersTitle">
      <div class="modal-head">
        <h2 id="usersTitle">Gebruikers</h2>
        <button id="closeUsersButton" class="close-button" type="button" aria-label="Sluiten">×</button>
      </div>
      <form id="addUserForm" class="user-form">
        <label>
          Gebruikersnaam
          <input id="newUsername" type="text" autocomplete="off" required />
        </label>
        <label>
          Wachtwoord
          <input id="newPassword" type="password" minlength="4" autocomplete="new-password" required />
        </label>
        <label class="checkbox">
          <input id="newAdmin" type="checkbox" />
          Beheerder
        </label>
        <button class="button button-primary" type="submit">Toevoegen</button>
      </form>
      <div id="userError" class="message error" hidden></div>
      <div id="userList" class="user-list"></div>
    </section>
  </div>

  <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite" hidden>
    <div class="loading-card">
      <p id="loadingText">Even geduld…</p>
      <div class="progress-track" aria-hidden="true">
        <div id="loadingBar" class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script src="/app.js?v=20261022c"></script>
</body>
</html>
